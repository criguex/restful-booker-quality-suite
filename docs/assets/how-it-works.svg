<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="How the suite runs in CI: pinned Restful Booker in Docker, health check, static gates, four Playwright projects, known defects as expected failures, reports">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#55DFBD" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55DFBD"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFC56E"/></marker>
  </defs>
  <rect width="1280" height="560" rx="20" fill="#071B2B"/>
  <rect width="1280" height="560" rx="20" fill="url(#grid)"/>

  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="40" y="52" font-size="26" font-weight="700" fill="#F4F7F5">How the suite runs on every push</text>
    <text x="40" y="80" font-size="15" fill="#ABC0C8">From .github/workflows/tests.yml and playwright.config.ts. The same commands run locally against 127.0.0.1:3001.</text>

    <g fill="none" stroke="#55DFBD" stroke-width="2.5">
      <path d="M230 152H266" marker-end="url(#a)"/>
      <path d="M480 152H516" marker-end="url(#a)"/>
      <path d="M720 152H756" marker-end="url(#a)"/>
      <path d="M970 152H1006" marker-end="url(#a)"/>
      <path d="M1125 194V250H181V266"/>
      <path d="M181 250V266" marker-end="url(#a)"/>
      <path d="M487 250V266" marker-end="url(#a)"/>
      <path d="M793 250V266" marker-end="url(#a)"/>
      <path d="M1099 250V266" marker-end="url(#a)"/>
      <path d="M181 380V416" marker-end="url(#a)"/>
      <path d="M1099 380V416" marker-end="url(#a)"/>
    </g>
    <path d="M290 380V398H680V416" fill="none" stroke="#FFC56E" stroke-width="2.5" marker-end="url(#g)"/>

    <rect x="40" y="110" width="190" height="84" rx="12" fill="#0D2638" stroke="#214456"/>
    <text x="58" y="142" font-size="16" font-weight="700" fill="#F4F7F5">GitHub Actions</text>
    <text x="58" y="166" font-size="13" fill="#ABC0C8">push · pull request</text>

    <rect x="270" y="110" width="210" height="84" rx="12" fill="#0D2638" stroke="#214456"/>
    <text x="288" y="142" font-size="16" font-weight="700" fill="#F4F7F5">Pinned target</text>
    <text x="288" y="166" font-size="13" font-family="Menlo,Consolas,monospace" fill="#ABC0C8">restful-booker@0046115</text>

    <rect x="520" y="110" width="200" height="84" rx="12" fill="#0D2638" stroke="#214456"/>
    <text x="538" y="142" font-size="16" font-weight="700" fill="#F4F7F5">Docker Compose</text>
    <text x="538" y="166" font-size="13" font-family="Menlo,Consolas,monospace" fill="#ABC0C8">127.0.0.1:3001</text>

    <rect x="760" y="110" width="210" height="84" rx="12" fill="#0D2638" stroke="#214456"/>
    <text x="778" y="142" font-size="16" font-weight="700" fill="#F4F7F5">Health check</text>
    <text x="778" y="166" font-size="13" fill="#ABC0C8">GET /ping · 30 tries × 2 s</text>
    <text x="760" y="218" font-size="13" fill="#FB8176">✗ <tspan fill="#ABC0C8">never ready → container logs, exit 1</tspan></text>

    <rect x="1010" y="110" width="230" height="84" rx="12" fill="#0D2638" stroke="#214456"/>
    <text x="1028" y="142" font-size="16" font-weight="700" fill="#F4F7F5">Static gates</text>
    <text x="1028" y="166" font-size="13" fill="#ABC0C8">Prettier · ESLint · tsc --noEmit</text>

    <text x="40" y="240" font-size="14" font-weight="700" fill="#55DFBD">npm test <tspan font-weight="400" fill="#ABC0C8">· four Playwright projects</tspan></text>

    <rect x="40" y="270" width="282" height="110" rx="12" fill="#0D2638" stroke="#55DFBD"/>
    <text x="58" y="302" font-size="17" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#F4F7F5">api</text>
    <text x="58" y="328" font-size="13" fill="#ABC0C8">CRUD, token and Basic auth,</text>
    <text x="58" y="348" font-size="13" fill="#ABC0C8">filters, Unicode, negatives,</text>
    <text x="58" y="368" font-size="13" fill="#ABC0C8">known defects</text>

    <rect x="346" y="270" width="282" height="110" rx="12" fill="#0D2638" stroke="#55DFBD"/>
    <text x="364" y="302" font-size="17" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#F4F7F5">contract</text>
    <text x="364" y="328" font-size="13" fill="#ABC0C8">strict Zod schemas for booking,</text>
    <text x="364" y="348" font-size="13" fill="#ABC0C8">ID list, creation and auth</text>
    <text x="364" y="368" font-size="13" fill="#ABC0C8">responses</text>

    <rect x="652" y="270" width="282" height="110" rx="12" fill="#0D2638" stroke="#55DFBD"/>
    <text x="670" y="302" font-size="17" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#F4F7F5">component</text>
    <text x="670" y="328" font-size="13" fill="#ABC0C8">the schemas alone, no API:</text>
    <text x="670" y="348" font-size="13" fill="#ABC0C8">dates, types, prices, names</text>

    <rect x="958" y="270" width="282" height="110" rx="12" fill="#0D2638" stroke="#55DFBD"/>
    <text x="976" y="302" font-size="17" font-weight="700" font-family="Menlo,Consolas,monospace" fill="#F4F7F5">performance</text>
    <text x="976" y="328" font-size="13" fill="#ABC0C8">/ping p95 &lt; 500 ms (20 samples)</text>
    <text x="976" y="348" font-size="13" fill="#ABC0C8">/booking list &lt; 1 s</text>

    <rect x="40" y="420" width="420" height="90" rx="12" fill="#123448" stroke="#214456"/>
    <text x="58" y="450" font-size="15" font-weight="700" fill="#F4F7F5">Each test owns its data</text>
    <text x="58" y="474" font-size="13" fill="#ABC0C8">create a booking → exercise it → delete it in finally,</text>
    <text x="58" y="494" font-size="13" fill="#ABC0C8">so tests run in parallel without seeded IDs</text>

    <rect x="500" y="420" width="400" height="90" rx="12" fill="#0D2638" stroke="#FFC56E"/>
    <text x="518" y="450" font-size="15" font-weight="700" fill="#FFC56E">! <tspan fill="#F4F7F5">8 known defects, 9 checks with test.fail</tspan></text>
    <text x="518" y="474" font-size="13" fill="#ABC0C8">still broken → expected failure, gate stays green</text>
    <text x="518" y="494" font-size="13" fill="#ABC0C8">fixed → unexpected pass, gate turns red</text>

    <rect x="940" y="420" width="300" height="90" rx="12" fill="#0D2638" stroke="#55DFBD"/>
    <text x="958" y="450" font-size="15" font-weight="700" fill="#55DFBD">✓ <tspan fill="#F4F7F5">Evidence</tspan></text>
    <text x="958" y="474" font-size="13" fill="#ABC0C8">HTML report, traces on failure</text>
    <text x="958" y="494" font-size="13" fill="#ABC0C8">uploaded as a CI artifact</text>

    <text x="40" y="540" font-size="13" fill="#8FA6B0">restful-booker-quality-suite · Cristian Guerra · QA · Medellín</text>
  </g>
</svg>
